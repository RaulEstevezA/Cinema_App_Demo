name: cinema_app
description: "Flutter movie discovery app powered by The Movie Database."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.4

dependencies:
  animate_do: ^5.1.0
  card_swiper: ^3.0.1
  dio: ^5.9.2
  drift: ^2.34.0
  drift_flutter: ^0.3.0
  flutter:
    sdk: flutter
  flutter_dotenv: ^6.0.1
  flutter_riverpod: ^3.3.1
  flutter_staggered_grid: ^0.1.2
  go_router: ^17.2.3
  intl: ^0.20.2
  path_provider: ^2.1.6

dev_dependencies:
  build_runner: ^2.15.0
  drift_dev: ^2.34.0
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.5

flutter:
  uses-material-design: true

  assets:
    - .env

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon.png"
