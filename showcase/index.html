<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Cinema App · Demo</title>
  <meta name="description" content="Demo web de Cinema App, una app Flutter para descubrir películas. Versión con datos locales de Wikidata y Wikimedia Commons." />
  <meta name="theme-color" content="#0d1117" />
  <link rel="canonical" href="https://raulesteveza.github.io/demos/Cinema_App/" />
  <link rel="icon" type="image/png" href="app/favicon.png" />
  <!--
    Página de presentación de la demo. Se publica en demos/Cinema_App/ y la app
    Flutter compilada en demos/Cinema_App/app/ (ver .github/workflows/deploy-demo.yml).
    Estilos alineados con https://raulesteveza.github.io (css/styles.css), copiados
    aquí para que la página no dependa de cambios en la web.
  -->
  <style>
    :root {
      --page-bg:    #0d1117;
      --window-bg:  #161b22;
      --text:       #e6edf3;
      --muted:      #8b949e;
      --accent:     #58a6ff;
      --btn-bg:     #21262d;
      --btn-text:   #c9d1d9;
      --btn-hover:  #30363d;
      --border:     #30363d;
      --tag-bg:     #1a2740;
      --tag-text:   #79c0ff;
      --warn-bg:    rgba(210, 153, 34, 0.1);
      --warn-border:#9e6a03;
      --warn-text:  #e3b341;
      --phone-w:    390px;
      --phone-h:    844px;
      --app-w:      390px;
      --app-h:      844px;
    }

    :root { color-scheme: dark; }

    *, *::before, *::after { box-sizing: border-box; }

    ::-webkit-scrollbar             { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track       { background: transparent; }
    ::-webkit-scrollbar-thumb       { background: var(--border); border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--muted); }

    html, body { height: 100%; }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--page-bg);
      color: var(--text);
      line-height: 1.5;
    }

    ::selection { background: rgba(88, 166, 255, 0.25); color: var(--text); }

    a { color: var(--accent); }

    /* ---------- Cabecera (igual que la web) ---------- */

    .container { max-width: 1100px; margin: 0 auto; padding: 1.5rem 2rem; }

    .nav { display: flex; justify-content: space-between; align-items: center; gap: 1rem; }

    .logo { color: var(--text); font-weight: 600; text-decoration: none; transition: opacity 0.15s; }
    .logo:hover { opacity: 0.75; }

    .lang { display: flex; gap: 0.5rem; }
    .lang button {
      background: none; border: 0; cursor: pointer; font: inherit;
      color: var(--muted); font-size: 0.9rem; font-weight: 500;
      padding: 2px 6px; border-radius: 4px; transition: color 0.15s;
    }
    .lang button[aria-pressed="true"] { color: var(--text); background: var(--btn-bg); }
    .lang button:hover { color: var(--text); }

    /* ---------- Escritorio: información + móvil ---------- */

    .stage {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 3rem;
      align-items: center;
      padding-top: 0.5rem;
      padding-bottom: 1.5rem;
    }

    .window {
      background: var(--window-bg);
      border: 1px solid var(--border);
      border-radius: 14px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5), 0 1px 0 rgba(255, 255, 255, 0.04);
      padding: 1.75rem 2.25rem;
    }

    h1 { font-size: 2.2rem; margin: 0 0 0.3rem; }
    h2 { font-size: 1.2rem; font-weight: 400; color: var(--muted); margin: 0 0 1rem; }

    .intro { margin: 0.75rem 0; line-height: 1.65; color: var(--muted); max-width: 560px; }

    .tags { margin: 0.5rem 0 1.25rem; }
    .tag {
      display: inline-block; margin: 2px 3px 2px 0; padding: 3px 10px;
      background: var(--tag-bg); color: var(--tag-text); border-radius: 20px;
      font-size: 0.8rem; font-weight: 500;
      font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', monospace;
    }

    .notice {
      border: 1px solid var(--warn-border);
      background: var(--warn-bg);
      border-radius: 10px;
      padding: 0.8rem 1.1rem;
      margin: 1rem 0;
      font-size: 0.92rem;
      line-height: 1.6;
    }
    .notice strong { color: var(--warn-text); }
    .notice ul { margin: 0.5rem 0 0; padding-left: 1.2rem; color: var(--btn-text); }
    .notice li { margin-bottom: 0.25rem; }

    .actions { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-top: 1.25rem; }

    .btn {
      display: inline-flex; align-items: center; gap: 0.4rem;
      padding: 0.5rem 1rem;
      background: var(--btn-bg); color: var(--btn-text);
      border: 1px solid var(--border); border-radius: 8px;
      text-decoration: none; font: inherit; font-weight: 500; font-size: 0.9rem;
      cursor: pointer;
      transition: background-color 0.15s ease, border-color 0.15s ease;
    }
    .btn:hover { background: var(--btn-hover); border-color: var(--muted); }
    .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .btn.primary { background: var(--accent); color: #0d1117; border-color: var(--accent); }
    .btn.primary:hover { background: #79c0ff; border-color: #79c0ff; }

    /* ---------- Marco del teléfono ---------- */

    .phone {
      /* Se ajusta a la altura de la ventana manteniendo la proporción del móvil. */
      height: min(var(--phone-h), calc(100dvh - 10rem));
      aspect-ratio: 390 / 844;
      padding: 12px;
      border-radius: 54px;
      background: #05070a;
      border: 1px solid var(--border);
      box-shadow:
        0 0 0 2px #1c2128,
        0 30px 80px rgba(0, 0, 0, 0.6),
        inset 0 0 0 1px rgba(255, 255, 255, 0.05);
      position: relative;
    }
    /* Botones laterales */
    .phone::before, .phone::after {
      content: ""; position: absolute; width: 3px; border-radius: 2px; background: #1c2128;
    }
    .phone::before { left: -4px; top: 18%; height: 9%; box-shadow: 0 calc(100% + 18px) 0 #1c2128; }
    .phone::after  { right: -4px; top: 24%; height: 13%; }

    /* La app se ejecuta siempre a tamaño de móvil real (--app-w × --app-h) y se
       escala para caber en el marco: así se maqueta igual que en un teléfono en
       vez de en una ventana más estrecha que cualquier móvil. */
    .screen {
      position: relative; width: 100%; height: 100%;
      overflow: hidden; border-radius: 42px; background: #f8f9ff;
    }
    .screen iframe {
      position: absolute; top: 0; left: 0;
      width: var(--app-w); height: var(--app-h);
      border: 0; background: #f8f9ff;
      transform: scale(var(--k, 1)); transform-origin: 0 0;
    }

    .hint { text-align: center; color: var(--muted); font-size: 0.82rem; margin-top: 0.9rem; }

    /* ---------- Créditos ---------- */

    dialog {
      width: min(760px, calc(100vw - 2rem));
      max-height: min(80dvh, 900px);
      padding: 0;
      background: var(--window-bg); color: var(--text);
      border: 1px solid var(--border); border-radius: 14px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
    }
    dialog::backdrop { background: rgba(1, 4, 9, 0.7); }
    .dialog-head {
      position: sticky; top: 0; z-index: 1;
      display: flex; justify-content: space-between; align-items: center; gap: 1rem;
      padding: 1rem 1.5rem; background: var(--window-bg); border-bottom: 1px solid var(--border);
    }
    .dialog-head h3 { margin: 0; font-size: 1.1rem; }
    .dialog-body { padding: 1rem 1.5rem 1.5rem; font-size: 0.9rem; }
    .dialog-body h4 { margin: 1.25rem 0 0.5rem; color: var(--muted); font-weight: 500; }
    .credits-list { list-style: none; padding: 0; margin: 0; }
    .credits-list li { padding: 0.45rem 0; border-bottom: 1px solid var(--border); overflow-wrap: anywhere; }
    .credits-list .meta { color: var(--muted); font-size: 0.85rem; }

    /* ---------- Móvil real: la app a pantalla completa ---------- */

    .mobile-only { display: none; }

    @media (max-width: 760px), (max-height: 560px) {
      body { overflow: hidden; }
      header, .stage { display: none; }
      .mobile-only { display: block; }

      .fullscreen-app {
        position: fixed; inset: 0;
        width: 100vw; height: 100dvh;
        border: 0; background: #f8f9ff;
      }

      /* Botón de información, discreto en el borde derecho */
      .info-fab {
        position: fixed; right: 0; top: 50%; transform: translateY(-50%);
        z-index: 2;
        width: 30px; height: 52px;
        border: 1px solid var(--border); border-right: 0;
        border-radius: 12px 0 0 12px;
        background: rgba(22, 27, 34, 0.85); color: var(--text);
        font: 600 1rem/1 Georgia, serif; cursor: pointer;
        backdrop-filter: blur(6px);
      }

      /* Hoja de información */
      .sheet {
        position: fixed; inset: auto 0 0 0; z-index: 3;
        max-height: 88dvh; overflow-y: auto;
        background: var(--window-bg);
        border-top: 1px solid var(--border);
        border-radius: 18px 18px 0 0;
        padding: 1.25rem 1.25rem calc(1.25rem + env(safe-area-inset-bottom));
        box-shadow: 0 -20px 60px rgba(0, 0, 0, 0.6);
        transform: translateY(105%);
        transition: transform 0.25s ease;
      }
      .sheet.open { transform: none; }
      .sheet-backdrop {
        position: fixed; inset: 0; z-index: 2;
        background: rgba(1, 4, 9, 0.6);
        opacity: 0; pointer-events: none; transition: opacity 0.25s ease;
      }
      .sheet-backdrop.open { opacity: 1; pointer-events: auto; }
      .sheet h1 { font-size: 1.6rem; }
      .sheet .grabber { width: 40px; height: 4px; border-radius: 2px; background: var(--border); margin: -0.25rem auto 1rem; }
      .sheet .actions .btn { flex: 1 1 auto; justify-content: center; }
    }
  </style>
</head>
<body>

  <!-- ========== Escritorio ========== -->

  <header class="container">
    <nav class="nav">
      <a class="logo" href="/">Raúl Estévez</a>
      <div class="lang" role="group" aria-label="Idioma / Language">
        <button type="button" data-lang="en">EN</button>
        <button type="button" data-lang="es">ES</button>
      </div>
    </nav>
  </header>

  <main class="container stage">
    <section class="window">
      <!-- La ficha se rellena desde la plantilla #info para compartirla con la versión móvil. -->
      <div data-info></div>
    </section>

    <div>
      <div class="phone">
        <div class="screen">
          <iframe id="desktop-app" title="Cinema App" loading="eager" allow="clipboard-write"></iframe>
        </div>
      </div>
      <p class="hint" data-i18n="hint">Arrastra con el ratón para desplazarte por los carruseles.</p>
    </div>
  </main>

  <!-- ========== Móvil real ========== -->

  <div class="mobile-only">
    <iframe id="mobile-app" class="fullscreen-app" title="Cinema App"></iframe>
    <button type="button" class="info-fab" aria-label="Información" data-open-sheet>i</button>
    <div class="sheet-backdrop" data-close-sheet></div>
    <aside class="sheet" aria-label="Información">
      <div class="grabber"></div>
      <div data-info></div>
      <div class="actions">
        <button type="button" class="btn primary" data-close-sheet data-i18n="view_demo">Ver la demo</button>
      </div>
    </aside>
  </div>

  <!-- Ficha de la demo (común a escritorio y móvil) -->
  <template id="info">
    <h1>Cinema App</h1>
    <h2 data-i18n="subtitle">App Flutter para descubrir películas</h2>

    <div class="tags">
      <span class="tag">Flutter</span>
      <span class="tag">Dart</span>
      <span class="tag">Riverpod</span>
      <span class="tag">Clean Architecture</span>
      <span class="tag">go_router</span>
      <span class="tag">Drift · SQLite</span>
    </div>

    <p class="intro" data-i18n="intro">
      Cartelera por secciones, búsqueda, géneros, ficha de cada película con su
      reparto y favoritos guardados en local. Esta es la versión web de la app
      móvil, ejecutándose tal cual en el navegador.
    </p>

    <div class="notice">
      <strong data-i18n="notice_title">Demo con datos locales</strong>
      <ul>
        <li data-i18n="notice_api">La app original usa la API de The Movie Database. Esta demo no usa ninguna API: las películas vienen de una base estática incluida en la app.</li>
        <li data-i18n="notice_sources">Datos de Wikidata (CC0), imágenes de Wikimedia Commons y sinopsis de Wikipedia (CC BY-SA 4.0).</li>
        <li data-i18n="notice_rating">Las estrellas son un índice de relevancia (en cuántas Wikipedias aparece la película), no valoraciones de usuarios.</li>
        <li data-i18n="notice_favorites">Los favoritos se guardan solo en este navegador.</li>
      </ul>
    </div>

    <div class="actions">
      <a class="btn primary" href="https://github.com/RaulEstevezA/Cinema_App" target="_blank" rel="noopener" data-i18n="code">Código y descarga</a>
      <a class="btn" href="app/" target="_blank" rel="noopener" data-i18n="fullscreen">Pantalla completa</a>
      <button type="button" class="btn" data-open-credits data-i18n="credits">Créditos</button>
      <a class="btn" href="https://raulesteveza.github.io/demos/" data-i18n="demos">Demos</a>
    </div>
  </template>

  <dialog id="credits">
    <div class="dialog-head">
      <h3 data-i18n="credits_title">Créditos</h3>
      <button type="button" class="btn" data-close-credits data-i18n="close">Cerrar</button>
    </div>
    <div class="dialog-body" id="credits-body">
      <p data-i18n="loading">Cargando…</p>
    </div>
  </dialog>

  <script>
    (function () {
      var APP_URL = 'app/';
      var ATTRIBUTIONS_URL = 'app/assets/assets/data/attributions.json';

      var texts = {
        es: {
          hint: 'Arrastra con el ratón para desplazarte por los carruseles.',
          subtitle: 'App Flutter para descubrir películas',
          intro: 'Cartelera por secciones, búsqueda, géneros, ficha de cada película con su reparto y favoritos guardados en local. Esta es la versión web de la app móvil, ejecutándose tal cual en el navegador.',
          notice_title: 'Demo con datos locales',
          notice_api: 'La app original usa la API de The Movie Database. Esta demo no usa ninguna API: las películas vienen de una base estática incluida en la app.',
          notice_sources: 'Datos de Wikidata (CC0), imágenes de Wikimedia Commons y sinopsis de Wikipedia (CC BY-SA 4.0).',
          notice_rating: 'Las estrellas son un índice de relevancia (en cuántas Wikipedias aparece la película), no valoraciones de usuarios.',
          notice_favorites: 'Los favoritos se guardan solo en este navegador.',
          code: 'Código y descarga',
          fullscreen: 'Pantalla completa',
          demos: 'Demos',
          credits: 'Créditos',
          credits_title: 'Créditos',
          close: 'Cerrar',
          loading: 'Cargando…',
          view_demo: 'Ver la demo',
          credits_data: 'Datos de películas: {wikidata}, CC0 1.0.',
          credits_texts: 'Sinopsis (Wikipedia en español, CC BY-SA 4.0)',
          credits_images: 'Imágenes (Wikimedia Commons)',
          used_in: 'Usada en',
          error: 'No se pudieron cargar los créditos.'
        },
        en: {
          hint: 'Drag with the mouse to scroll the carousels.',
          subtitle: 'Flutter app to discover movies',
          intro: 'Movie listings by section, search, genres, movie details with cast and favourites stored locally. This is the web build of the mobile app, running as-is in the browser.',
          notice_title: 'Demo with local data',
          notice_api: 'The original app uses The Movie Database API. This demo uses no API at all: movies come from a static database bundled with the app.',
          notice_sources: 'Data from Wikidata (CC0), images from Wikimedia Commons and plots from Spanish Wikipedia (CC BY-SA 4.0).',
          notice_rating: 'Stars are a relevance index (how many Wikipedias cover the movie), not user ratings.',
          notice_favorites: 'Favourites are only stored in this browser.',
          code: 'Code & download',
          fullscreen: 'Full screen',
          demos: 'Demos',
          credits: 'Credits',
          credits_title: 'Credits',
          close: 'Close',
          loading: 'Loading…',
          view_demo: 'View demo',
          credits_data: 'Movie data: {wikidata}, CC0 1.0.',
          credits_texts: 'Plots (Spanish Wikipedia, CC BY-SA 4.0)',
          credits_images: 'Images (Wikimedia Commons)',
          used_in: 'Used in',
          error: 'Credits could not be loaded.'
        }
      };

      // --- Idioma: misma preferencia que la web (localStorage 'lang') ---

      function readLang() {
        try {
          var stored = localStorage.getItem('lang');
          if (stored === 'es' || stored === 'en') return stored;
        } catch (e) {}
        return (navigator.language || '').slice(0, 2).toLowerCase() === 'es' ? 'es' : 'en';
      }

      var lang = readLang();

      function t(key) { return texts[lang][key] || texts.es[key] || key; }

      function applyLang() {
        document.documentElement.lang = lang;
        document.querySelectorAll('[data-i18n]').forEach(function (el) {
          el.textContent = t(el.dataset.i18n);
        });
        document.querySelectorAll('.lang button').forEach(function (button) {
          button.setAttribute('aria-pressed', String(button.dataset.lang === lang));
        });
        if (creditsLoaded) renderCredits(creditsData);
      }

      document.querySelectorAll('.lang button').forEach(function (button) {
        button.addEventListener('click', function () {
          lang = button.dataset.lang;
          try { localStorage.setItem('lang', lang); } catch (e) {}
          applyLang();
        });
      });

      // --- Ficha compartida ---

      var template = document.getElementById('info');
      document.querySelectorAll('[data-info]').forEach(function (slot) {
        slot.appendChild(template.content.cloneNode(true));
      });

      // --- Una sola instancia de la app: en el marco o a pantalla completa ---

      var mobileQuery = window.matchMedia('(max-width: 760px), (max-height: 560px)');
      var desktopFrame = document.getElementById('desktop-app');
      var mobileFrame = document.getElementById('mobile-app');

      function mountApp() {
        var active = mobileQuery.matches ? mobileFrame : desktopFrame;
        var inactive = mobileQuery.matches ? desktopFrame : mobileFrame;
        if (inactive.getAttribute('src')) inactive.removeAttribute('src');
        if (!active.getAttribute('src')) active.setAttribute('src', APP_URL);
      }

      mountApp();
      mobileQuery.addEventListener('change', mountApp);

      // Escala de la app dentro del marco (ver .screen en el CSS).
      var screenEl = desktopFrame.parentElement;
      function fitApp() {
        var k = Math.min(screenEl.clientWidth / 390, screenEl.clientHeight / 844);
        screenEl.style.setProperty('--k', k || 1);
        // La altura de la app se ajusta a la del marco para no dejar huecos por redondeo.
        screenEl.style.setProperty('--app-h', (k ? screenEl.clientHeight / k : 844) + 'px');
      }
      if (window.ResizeObserver) new ResizeObserver(fitApp).observe(screenEl);
      fitApp();

      // --- Hoja de información (móvil): se muestra una vez por sesión ---

      var sheet = document.querySelector('.sheet');
      var backdrop = document.querySelector('.sheet-backdrop');

      function setSheet(open) {
        sheet.classList.toggle('open', open);
        backdrop.classList.toggle('open', open);
      }

      document.querySelectorAll('[data-open-sheet]').forEach(function (el) {
        el.addEventListener('click', function () { setSheet(true); });
      });
      document.querySelectorAll('[data-close-sheet]').forEach(function (el) {
        el.addEventListener('click', function () { setSheet(false); });
      });

      if (mobileQuery.matches) {
        var seen = false;
        try { seen = sessionStorage.getItem('cinema-demo-sheet') === '1'; } catch (e) {}
        if (!seen) {
          setSheet(true);
          try { sessionStorage.setItem('cinema-demo-sheet', '1'); } catch (e) {}
        }
      }

      // --- Créditos (attributions.json generado por tool/generate_static_db.dart) ---

      var dialog = document.getElementById('credits');
      var body = document.getElementById('credits-body');
      var creditsLoaded = false;
      var creditsData = null;

      function el(tag, attrs, children) {
        var node = document.createElement(tag);
        Object.keys(attrs || {}).forEach(function (key) { node.setAttribute(key, attrs[key]); });
        (children || []).forEach(function (child) {
          node.append(child);
        });
        return node;
      }

      function link(href, text) {
        return el('a', { href: href, target: '_blank', rel: 'noopener' }, [text]);
      }

      function renderCredits(data) {
        body.textContent = '';

        var dataLine = el('p');
        var parts = t('credits_data').split('{wikidata}');
        dataLine.append(parts[0], link('https://www.wikidata.org', 'Wikidata'), parts[1]);
        body.append(dataLine);

        body.append(el('h4', {}, [t('credits_texts')]));
        body.append(el('ul', { class: 'credits-list' }, data.texts.map(function (text) {
          return el('li', {}, [link(text.source_url, text.title)]);
        })));

        body.append(el('h4', {}, [t('credits_images') + ' · ' + data.images.length]));
        body.append(el('ul', { class: 'credits-list' }, data.images.map(function (image) {
          var license = image.license_url ? link(image.license_url, image.license) : image.license;
          return el('li', {}, [
            link(image.source_url, image.file),
            el('div', { class: 'meta' }, [
              image.artist + ' · ', license, ' · ' + t('used_in') + ': ' + image.used_by.join(', ')
            ])
          ]);
        })));
      }

      function openCredits() {
        setSheet(false);
        dialog.showModal();
        if (creditsLoaded) return;
        fetch(ATTRIBUTIONS_URL)
          .then(function (response) {
            if (!response.ok) throw new Error(response.status);
            return response.json();
          })
          .then(function (data) {
            creditsData = data;
            creditsLoaded = true;
            renderCredits(data);
          })
          .catch(function () { body.textContent = t('error'); });
      }

      document.querySelectorAll('[data-open-credits]').forEach(function (el) {
        el.addEventListener('click', openCredits);
      });
      document.querySelector('[data-close-credits]').addEventListener('click', function () {
        dialog.close();
      });
      dialog.addEventListener('click', function (event) {
        if (event.target === dialog) dialog.close();
      });

      applyLang();
    })();
  </script>
</body>
</html>
